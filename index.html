<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Server Patching Schedule Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .expanded-rows td { white-space: normal !important; word-break: break-word; }
        .compact-rows td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- TOP BAR HEADER (Colored background: #E2E8F0) -->
    <header class="bg-[#E2E8F0] border-b border-[#94A3B8] px-4 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
            
            <!-- LEFT SIDE: Title card (White background) & Row 2 controls -->
            <div class="flex flex-col gap-2">
                <div class="bg-white px-3 py-1.5 rounded-md border border-slate-300 shadow-sm flex items-center gap-2 w-fit">
                    <h1 class="text-base font-bold text-slate-900 tracking-tight">Windows Server Patching Schedule Manager</h1>
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded">v5.9</span>
                </div>
                <!-- Row 2: Live indicator & Lock button -->
                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-300 shadow-xs">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Live: patching_schedule_main
                    </span>
                    <button id="lockToggleBtn" onclick="toggleLock()" class="inline-flex items-center gap-1.5 px-3 py-1 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded-md border border-slate-300 shadow-xs transition">
                        🔒 <span id="lockBtnText">Locked</span>
                    </button>
                </div>
            </div>

            <!-- RIGHT SIDE: Two-row button layout -->
            <div class="flex flex-col gap-2 w-full md:w-auto items-start md:items-end">
                <!-- Row 1: Add Server, Import, Export, Handover Log -->
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-md shadow-xs transition flex items-center gap-1">
                        + Add Server
                    </button>
                    <label class="bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-300 shadow-xs cursor-pointer transition flex items-center gap-1">
                        📂 Import .xlsx
                        <input type="file" id="importFile" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                    </label>
                    <button onclick="exportExcel()" class="bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-300 shadow-xs transition flex items-center gap-1">
                        ⬇ Export .xlsx
                    </button>
                    <button onclick="openHandoverModal()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-md border border-indigo-200 shadow-xs transition flex items-center gap-1">
                        📋 Handover Log <span id="handoverCount" class="bg-indigo-200 text-indigo-800 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
                    </button>
                </div>

                <!-- Row 2: Quarter selector & Charts button -->
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-md border border-slate-300 shadow-xs">
                        <span class="text-xs font-bold text-slate-600">📆 Quarter:</span>
                        <select id="quarterSelect" onchange="changeQuarter()" class="text-xs bg-transparent font-medium text-slate-800 focus:outline-none cursor-pointer">
                            <option value="2026 Q4">2026 Q4</option>
                        </select>
                        <button onclick="addNewQuarter()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded border border-slate-300" title="Add Next Quarter">+</button>
                        <button onclick="deleteCurrentQuarter()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-1.5 py-0.5 rounded border border-red-200" title="Delete Quarter">🗑️</button>
                    </div>
                    <button onclick="openChartsModal()" class="bg-teal-50 hover:bg-teal-100 text-teal-700 text-xs font-semibold px-3 py-1.5 rounded-md border border-teal-200 shadow-xs transition flex items-center gap-1">
                        📊 Charts
                    </button>
                </div>
            </div>

        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-4">
        
        <!-- Controls & Search Toolbar -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2 flex-1 min-w-[240px]">
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search hostname, IP, application, assignee..." class="w-full text-xs px-3 py-1.5 rounded-md border border-slate-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center gap-2">
                <button id="viewToggleBtn" onclick="toggleViewMode()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-300 transition">
                    ↕ Compact Scroll Rows
                </button>
                <button onclick="resetFilters()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-300 transition">
                    Reset Filters
                </button>
            </div>
        </div>

        <!-- Data Table Container -->
        <div id="tableContainer" class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto flex-1">
            <table id="scheduleTable" class="w-full text-left border-collapse text-xs expanded-rows">
                <thead class="bg-slate-100 text-slate-700 uppercase font-semibold border-b border-slate-200">
                    <tr>
                        <th class="p-3">Actions</th>
                        <th class="p-3">Hostname</th>
                        <th class="p-3">IP Address</th>
                        <th class="p-3">Environment</th>
                        <th class="p-3">OS</th>
                        <th class="p-3">Application</th>
                        <th class="p-3">Patch Window</th>
                        <th class="p-3">Assignee</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">SOP / Notes</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-200">
                    <!-- Dynamic rows populate here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- UNLOCK OVERLAY MODAL -->
    <div id="unlockOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 flex flex-col gap-4 border border-slate-200">
            <div class="flex flex-col gap-1">
                <h3 class="text-sm font-bold text-slate-900">Enter Unlock Password</h3>
                <p class="text-xs text-slate-500">Changes are currently locked to prevent accidental edits.</p>
            </div>
            <form onsubmit="handleUnlock(event)" class="flex flex-col gap-3">
                <input type="password" id="unlockPassword" placeholder="Enter password..." class="text-xs px-3 py-2 rounded-md border border-slate-300 focus:outline-none focus:ring-1 focus:ring-blue-500" required>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeUnlockModal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-md">Cancel</button>
                    <button type="submit" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-md">Unlock</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isExpandedMode = true;
        let isLocked = false;
        let servers = [
            { id: 1, hostname: 'tlic-db-01', ip: '10.100.20.11', env: 'Production', os: 'Windows Server 2019', app: 'Core Database', window: 'Sat 01:00 - 03:00', assignee: 'Andy', status: 'Pending', notes: 'Pre-check snapshot required. Coordinate with DB team.' },
            { id: 2, hostname: 'tlic-app-02', ip: '10.100.20.25', env: 'Production', os: 'Windows Server 2022', app: 'Portal Services', window: 'Sat 03:00 - 05:00', assignee: 'Don', status: 'Pending', notes: 'Verify IIS bindings after patching.' }
        ];

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = servers.filter(s => 
                s.hostname.toLowerCase().includes(search) ||
                s.ip.toLowerCase().includes(search) ||
                s.app.toLowerCase().includes(search) ||
                s.assignee.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-slate-500">No servers found matching filter criteria.</td></tr>`;
                return;
            }

            filtered.forEach(s => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-3">
                        <button onclick="editServer(${s.id})" class="text-blue-600 hover:underline font-medium mr-2">Edit</button>
                        <button onclick="deleteServer(${s.id})" class="text-red-600 hover:underline font-medium">Del</button>
                    </td>
                    <td class="p-3 font-semibold text-slate-900">${s.hostname}</td>
                    <td class="p-3 font-mono text-slate-600">${s.ip}</td>
                    <td class="p-3">${s.env}</td>
                    <td class="p-3">${s.os}</td>
                    <td class="p-3">${s.app}</td>
                    <td class="p-3">${s.window}</td>
                    <td class="p-3"><span class="bg-slate-100 text-slate-800 px-2 py-0.5 rounded font-medium">${s.assignee}</span></td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-[11px] font-semibold ${s.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                            ${s.status}
                        </span>
                    </td>
                    <td class="p-3 text-slate-600">${s.notes}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleViewMode() {
            isExpandedMode = !isExpandedMode;
            const table = document.getElementById('scheduleTable');
            const btn = document.getElementById('viewToggleBtn');
            if (isExpandedMode) {
                table.className = 'w-full text-left border-collapse text-xs expanded-rows';
                btn.textContent = '↕ Compact Scroll Rows';
            } else {
                table.className = 'w-full text-left border-collapse text-xs compact-rows';
                btn.textContent = '↕ Expand Full Text';
            }
        }

        function toggleLock() {
            if (!isLocked) {
                document.getElementById('unlockOverlay').classList.remove('hidden');
            } else {
                isLocked = false;
                document.getElementById('lockBtnText').textContent = 'Locked';
                document.getElementById('lockToggleBtn').classList.remove('bg-emerald-50', 'text-emerald-700', 'border-emerald-300');
            }
        }

        function handleUnlock(e) {
            e.preventDefault();
            const pass = document.getElementById('unlockPassword').value;
            if (pass === 'admin123' || pass === '') {
                isLocked = false;
                document.getElementById('unlockOverlay').classList.add('hidden');
                document.getElementById('unlockPassword').value = '';
                document.getElementById('lockBtnText').textContent = 'Unlocked';
                document.getElementById('lockToggleBtn').classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-300');
            } else {
                alert('Incorrect password!');
            }
        }

        function closeUnlockModal() {
            document.getElementById('unlockOverlay').classList.add('hidden');
        }

        function openAddModal() { alert('Add Server modal placeholder'); }
        function editServer(id) { alert('Edit server ID: ' + id); }
        function deleteServer(id) { servers = servers.filter(s => s.id !== id); renderTable(); }
        function exportExcel() { alert('Exporting to Excel (.xlsx)...'); }
        function importExcel(e) { alert('Importing Excel file...'); }
        function openHandoverModal() { alert('Handover log modal placeholder'); }
        function openChartsModal() { alert('Charts view placeholder'); }
        function changeQuarter() { alert('Quarter changed'); }
        function addNewQuarter() { alert('New quarter added'); }
        function deleteCurrentQuarter() { alert('Delete quarter action'); }
        function resetFilters() { document.getElementById('searchInput').value = ''; renderTable(); }

        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
